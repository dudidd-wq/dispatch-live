name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Python unit tests (stdlib only)
        run: python -m unittest discover -s tests -v
      - name: Inline JavaScript parses
        run: node tests/check_js.js
      - name: Render test in a headless browser
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
          node tests/render_test.js

name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Python unit tests (stdlib only)
        run: python -m unittest discover -s tests -v
      - name: Inline JavaScript parses
        run: node tests/check_js.js && node tests/check_alertkind.js
      - name: Render test in a headless browser
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
          node tests/render_test.js

  # A new build number on main becomes a tagged GitHub Release with the
  # install zip attached. The release is skipped when that tag already exists.
  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build number
        id: v
        run: |
          build=$(grep -o "const DL_BUILD = '[^']*'" index.html | cut -d"'" -f2)
          # dd.mm-NN exactly; anything else is a mistake, not a release
          echo "$build" | grep -Eq '^[0-9]{2}\.[0-9]{2}-[0-9]+$'
          echo "build=$build" >> "$GITHUB_OUTPUT"
          # the whole build string: the counter alone is not unique across dates
          echo "tag=v$build" >> "$GITHUB_OUTPUT"
      - name: Skip when this build is already released
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(gh api "repos/${{ github.repository }}/releases/tags/${{ steps.v.outputs.tag }}" --silent --include 2>/dev/null | head -1 | awk '{print $2}')
          if [ "$code" = "200" ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" = "404" ]; then
            echo "yes=false" >> "$GITHUB_OUTPUT"
          else
            echo "Could not tell whether the release exists (HTTP '$code'); refusing to guess." >&2
            exit 1
          fi
      - name: Build the install zip
        if: steps.exists.outputs.yes == 'false'
        run: |
          mkdir -p out/dispatch-live-app
          cp index.html server.py brain.py dlconfig.py dlarchive.py dlupdate.py make_hayomyom.py *.bat *.sh *.command README.md CHANGELOG.md out/dispatch-live-app/
          cp -r docs out/dispatch-live-app/docs
          cp -r content out/dispatch-live-app/content
          (cd out && zip -qr "../dispatch-live-${{ steps.v.outputs.tag }}.zip" dispatch-live-app)
          # release notes = this build's section of the changelog (exact heading match)
          awk -v h="v${{ steps.v.outputs.build }}" '
            /^## /{ if (on) exit; on = ($2 == h); next } on' CHANGELOG.md > notes.md
          test -s notes.md || echo "Build ${{ steps.v.outputs.build }}" > notes.md
      - name: Publish the release
        if: steps.exists.outputs.yes == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.v.outputs.tag }}" "dispatch-live-${{ steps.v.outputs.tag }}.zip" \
            --target "$GITHUB_SHA" --title "Dispatch LIVE ${{ steps.v.outputs.build }}" --notes-file notes.md
